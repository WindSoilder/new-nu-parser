[package]
name = "new-nu-parser"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tracy-client = { version = "0.17.3", default-features = false } # for tracy v0.11.1
logos = "0.15"
nu-cmd-lang = { path = "../nushell/crates/nu-cmd-lang", default-features = false, features = ["os"] }
nu-command = { path = "../nushell/crates/nu-command", default-features = false, features = ["os"] }
nu-engine = { path = "../nushell/crates/nu-engine", default-features = false, features = ["os"] }
nu-protocol = { path = "../nushell/crates/nu-protocol", default-features = false, features = ["os"] }
reedline = { version = "0.51.0", default-features = false }

[profile.profiling]
inherits = "release"
debug = true

[features]
# By default, profiling is disabled. Enable it by the "profile" feature
tracy = [
    "tracy-client/enable",
    "tracy-client/flush-on-exit",
    "tracy-client/sampling",
    "tracy-client/code-transfer",
]

[lib]
name = "new_nu_parser"
path = "src/lib.rs"

[dev-dependencies]
insta = { version = "1.33.0", features = ["glob"] }
tango-bench = "0.6"

[[bench]]
name = "benchmarks"
harness = false
